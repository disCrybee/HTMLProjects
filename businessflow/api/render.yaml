services:
  - type: web
    name: businessflow-api
    runtime: python
    plan: free
    rootDir: businessflow/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BUSINESSFLOW_SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://businessflow-crm.pages.dev
      - key: DATABASE_URL
        sync: false
